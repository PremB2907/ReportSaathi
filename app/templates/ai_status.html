<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReportSaathi AI Diagnostics Dashboard</title>
  <!-- Outfit Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f14;
      --yellow: #fbee3d;
      --green: #3dfb76;
      --cyan: #3df3fb;
      --red: #fb3d58;
      --border: #000000;
      --card-bg: #1a1e26;
      --text: #e0e5ed;
      --text-muted: #8fa0b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    header {
      background: var(--yellow);
      color: var(--border);
      padding: 24px;
      border: 4px solid var(--border);
      box-shadow: 8px 8px 0px var(--border);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    header p {
      font-size: 1rem;
      font-weight: 600;
    }

    .card {
      background: var(--card-bg);
      border: 4px solid var(--border);
      box-shadow: 8px 8px 0px var(--border);
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .provider-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media(min-width: 600px) {
      .provider-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .provider-card {
      background: #232a36;
      border: 3px solid var(--border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 15px;
      transition: transform 0.2s;
    }

    .provider-card:hover {
      transform: translateY(-2px);
    }

    .provider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
    }

    .provider-name {
      font-size: 1.4rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .indicator {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--border);
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }

    .indicator.active {
      background-color: var(--green);
      box-shadow: 0 0 12px var(--green);
    }

    .indicator.inactive {
      background-color: var(--red);
      box-shadow: 0 0 12px var(--red);
    }

    .indicator.checking {
      background-color: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }

    .provider-details {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.95rem;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
    }

    .detail-label {
      color: var(--text-muted);
    }

    .detail-val {
      font-weight: 600;
    }

    button {
      background: var(--cyan);
      color: var(--border);
      border: 3px solid var(--border);
      padding: 10px 20px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 4px 4px 0px var(--border);
      transition: all 0.1s;
    }

    button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--border);
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--border);
    }

    .console-card {
      background: #000;
      color: #3dfb76;
      font-family: monospace;
      padding: 20px;
      border: 4px solid var(--border);
      box-shadow: 8px 8px 0px var(--border);
      height: 250px;
      overflow-y: auto;
      font-size: 0.9rem;
    }

    .console-line {
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .console-timestamp {
      color: #888;
    }

    .refresh-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-summary {
      font-weight: 800;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🩺 ReportSaathi AI Diagnostics</h1>
      <p>System Provider status check & Connection Test Dashboard</p>
    </header>

    <div class="card">
      <div class="refresh-bar">
        <div class="status-summary" id="overall-status">
          Loading AI status summary...
        </div>
        <button onclick="refreshStatus()">🔄 Refresh Status</button>
      </div>

      <div class="provider-grid" id="providers-container">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <div class="console-card" id="console">
      <div class="console-line"><span class="console-timestamp">[System Info]</span> Terminal active. Diagnostics logging started...</div>
    </div>
  </div>

  <script>
    function log(message, isError = false) {
      const consoleBox = document.getElementById('console');
      const time = new Date().toLocaleTimeString();
      const color = isError ? 'var(--red)' : '#3dfb76';
      consoleBox.innerHTML += `<div class="console-line" style="color: ${color}"><span class="console-timestamp">[${time}]</span> ${message}</div>`;
      consoleBox.scrollTop = consoleBox.scrollHeight;
    }

    async function refreshStatus() {
      log("Fetching current configuration values...");
      try {
        const res = await fetch('/api/ai/status');
        const data = await res.json();
        
        // Render overall status summary
        const summary = document.getElementById('overall-status');
        if (data.healthy) {
          summary.innerHTML = `🟢 SYSTEM UNIFIED HEALTHY (Active: <span style="color:var(--cyan);text-transform:uppercase">${data.active_provider}</span>)`;
        } else {
          summary.innerHTML = `🔴 SYSTEM DEGRADED / UNHEALTHY`;
        }

        // Render providers
        const container = document.getElementById('providers-container');
        container.innerHTML = '';

        for (const [name, info] of Object.entries(data.providers)) {
          const indicatorClass = info.available ? 'active' : 'inactive';
          const cardHtml = `
            <div class="provider-card">
              <div class="provider-header">
                <span class="provider-name">${name}</span>
                <div class="indicator ${indicatorClass}"></div>
              </div>
              <div class="provider-details">
                <div class="detail-row">
                  <span class="detail-label">Configured:</span>
                  <span class="detail-val">${info.configured ? 'YES' : 'NO'}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Available:</span>
                  <span class="detail-val">${info.available ? 'YES' : 'NO'}</span>
                </div>
                <div class="detail-row">
                  <span class="detail-label">Status check:</span>
                  <span class="detail-val" style="color:${info.available ? 'var(--green)' : 'var(--red)'}">${info.reason}</span>
                </div>
              </div>
              <button onclick="testConnection('${name}')">Test ${name}</button>
            </div>
          `;
          container.innerHTML += cardHtml;
        }
        log("Fetched configurations updated successfully.");
      } catch (err) {
        log("Error checking configurations: " + err.message, true);
      }
    }

    async function testConnection(providerName) {
      log(`Sending tiny test connection request to [${providerName}] (Zero patient data)...`);
      try {
        const res = await fetch('/api/ai/test-provider', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ provider: providerName })
        });
        const data = await res.json();
        if (data.success) {
          log(`[${providerName}] Success! Response: "${data.response}"`);
        } else {
          log(`[${providerName}] Test failed: ${data.error}`, true);
        }
      } catch (err) {
        log(`[${providerName}] Error: ${err.message}`, true);
      }
    }

    // Initial load
    refreshStatus();
  </script>
</body>
</html>
